name: CI Checks

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

jobs:
  test-frontend:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cinemastream/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: cinemastream/frontend

      - name: Run Linter
        run: npm run lint --if-present
        working-directory: cinemastream/frontend

      - name: Run Tests
        run: npm test
        working-directory: cinemastream/frontend