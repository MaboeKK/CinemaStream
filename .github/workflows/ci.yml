name: CI Checks

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

jobs:
  test-frontend:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cinemastream/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: cinemastream/frontend

      - name: Run Linter
        run: npm run lint --if-present
        working-directory: cinemastream/frontend

      - name: Run Tests
        run: npm test
        working-directory: cinemastream/frontend

  test-backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    # Credentials match backend/.env.test's POSTGRES_URI so the integration
    # suite (NODE_ENV=test, set automatically by vitest) needs no overrides.
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: kmaboe
          POSTGRES_PASSWORD: localdevpass
          POSTGRES_DB: cinemastream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kmaboe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cinemastream/backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: cinemastream/backend

      - name: Load database schema
        run: PGPASSWORD=localdevpass psql -h localhost -U kmaboe -d cinemastream_test -f db/schema.sql
        working-directory: cinemastream/backend

      - name: Run Linter
        run: npm run lint --if-present
        working-directory: cinemastream/backend

      - name: Run Tests
        run: npm test
        working-directory: cinemastream/backend